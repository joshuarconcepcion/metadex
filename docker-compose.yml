services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app/backend
      - chroma_db:/app/chroma_db
      - cache:/app/cache
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  chroma_db:
  cache:
